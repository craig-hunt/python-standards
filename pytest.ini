[pytest]
testpaths = tests
# Async tests run without a per-test marker, because every monitor here is
# async and marking each one adds a line that says nothing.
asyncio_mode = auto
# Set explicitly rather than inherited. pytest-asyncio warns that the default
# changes in a future release, and because warnings fail here the warning
# surfaced as an error on the first run, which is the point of standard 3: an
# unset option that will change behavior later is something to decide now.
asyncio_default_fixture_loop_scope = function
# -q keeps a passing run to one line, so a failure is the only thing that
# occupies the terminal.
addopts = -q
filterwarnings =
    # A warning that nobody reads is a warning that costs nothing to ignore,
    # so they fail instead. See standard 3.
    error
