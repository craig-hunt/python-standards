[mutmut]
source_paths = pythonstandards

# The mutation workspace needs every file the suite reads, not only the
# package. A test that parses the schema script or imports from scripts/
# cannot even be collected without them, and mutmut reports that as the whole
# suite failing rather than as a missing file.
also_copy =
    pythonstandards/
    tests/
    scripts/
    sql/
    config.yaml
    pytest.ini
    ruff.toml

# Prose and log text sit outside the denominator. A mutant that rewords a log
# line or a recommendation is unkillable without a test that pins the copy,
# and pinning copy makes an editorial pass fail the suite while proving
# nothing about behavior.
#
# The patterns stay narrow on purpose. Matching every string literal would
# also exclude the behavioral ones: a finding's type, its detail key, a route,
# an environment variable name. Those must stay in. See standard 1.
#
# The last pattern is the one that needs justifying. It matches a line that is
# ONLY a string literal, which is how a continuation of a multi-line message
# looks and nothing else does: a behavioral literal always carries a name, a
# key or a call on the same line. Measured before and after, it moved prose
# out of the denominator without moving a single behavioral string with it.
do_not_mutate_patterns =
    ^\s*logger\.(debug|info|warning|error|exception)\(
    ^\s*(message|recommendation|note|summary|reason|help)\s*=\s*\(?["']
    ^\s*"""
    ^\s*#
    ^\s*f?["'][^"']*["'],?\s*$
